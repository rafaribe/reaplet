apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: reaplet-agent
  namespace: reaplet
  labels:
    app.kubernetes.io/name: reaplet
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reaplet
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reaplet
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: reaplet
      hostPID: true
      containers:
        - name: agent
          image: ghcr.io/rafaribe/reaplet:latest
          env:
            - name: PORT
              value: "8081"
            - name: CRI_SOCKET
              value: "unix:///run/containerd/containerd.sock"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: false
          resources:
            requests:
              memory: "16Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      tolerations:
        - operator: Exists
          effect: NoSchedule
