apiVersion: apps/v1
kind: Deployment
metadata:
  name: reaplet
  namespace: reaplet
  labels:
    app.kubernetes.io/name: reaplet
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reaplet
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reaplet
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: reaplet
      containers:
        - name: reaplet
          image: ghcr.io/rafaribe/reaplet:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/nodes
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/nodes
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reaplet
  namespace: reaplet
spec:
  selector:
    app.kubernetes.io/name: reaplet
    app.kubernetes.io/component: server
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
