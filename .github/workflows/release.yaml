---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Release & Push Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Check what already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"

          # Check if git tag exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if GitHub release exists
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if container image exists in GHCR
          IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version_tag }}"
          git push origin "${{ steps.version.outputs.version_tag }}"

      - name: Generate release notes
        if: steps.check.outputs.release_exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: ${{ steps.version.outputs.version_tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false

      - name: Setup Mise
        if: steps.check.outputs.image_exists == 'false'
        uses: jdx/mise-action@v2
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        if: steps.check.outputs.image_exists == 'false'
        id: versions
        run: |
          echo "go-version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.image_exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.image_exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.image_exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.image_exists == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.image_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version_tag }}
            REVISION=${{ github.sha }}
            GO_VERSION=${{ steps.versions.outputs.go-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
