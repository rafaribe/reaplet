---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      release_exists: ${{ steps.check.outputs.release_exists }}
      image_exists: ${{ steps.check.outputs.image_exists }}
      go_version: ${{ steps.versions.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Check what already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        id: versions
        run: |
          echo "go-version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version_tag }}"
          git push origin "${{ steps.version.outputs.version_tag }}"

      - name: Generate release notes
        if: steps.check.outputs.release_exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: ${{ steps.version.outputs.version_tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.image_exists == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version_tag }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version_tag }}
            REVISION=${{ github.sha }}
            GO_VERSION=${{ needs.version.outputs.go_version }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

  manifest:
    name: Create Multi-Arch Manifest
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version_tag }}
        run: |
          # Create manifest list for all tag variants
          for TAG in "${VERSION}" "latest"; do
            docker manifest create "${IMAGE}:${TAG}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"

            docker manifest annotate "${IMAGE}:${TAG}" \
              "${IMAGE}:${VERSION}-amd64" --os linux --arch amd64
            docker manifest annotate "${IMAGE}:${TAG}" \
              "${IMAGE}:${VERSION}-arm64" --os linux --arch arm64

            docker manifest push "${IMAGE}:${TAG}"
          done

          # Also tag major.minor
          MINOR_TAG=$(echo "$VERSION" | grep -oP '^\d+\.\d+')
          if [ -n "$MINOR_TAG" ]; then
            docker manifest create "${IMAGE}:${MINOR_TAG}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
            docker manifest annotate "${IMAGE}:${MINOR_TAG}" \
              "${IMAGE}:${VERSION}-amd64" --os linux --arch amd64
            docker manifest annotate "${IMAGE}:${MINOR_TAG}" \
              "${IMAGE}:${VERSION}-arm64" --os linux --arch arm64
            docker manifest push "${IMAGE}:${MINOR_TAG}"
          fi
