<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaplet — Node Storage Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply theme before paint to prevent FOUC
    (function(){
      var t = localStorage.getItem('reaplet-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <h1 class="brand"><span>🌾</span><span class="brand-text">Reaplet</span></h1>
        <span class="brand-subtitle">Storage Monitor</span>
      </div>
      <div class="header-right">
        <div class="status-bar" id="last-updated"><span class="pulse-dot"></span> Loading...</div>
        <button class="btn-icon" onclick="loadAll()" title="Refresh"><span id="refresh-icon">↻</span></button>
        <div class="theme-toggle">
          <button class="btn-icon" onclick="toggleThemeDropdown()" title="Theme">🎨</button>
          <div class="theme-dropdown" id="theme-dropdown" style="display:none"></div>
        </div>
      </div>
    </header>

    <div class="tab-bar" id="tabs"></div>

    <main id="content"></main>

    <footer class="app-footer">
      <span class="footer-text">
        Auto-refresh
        <button class="auto-toggle" id="auto-toggle" onclick="toggleAutoRefresh()">On</button>
      </span>
    </footer>
  </div>

  <div class="modal-overlay" id="modal" onclick="modalCancel()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-icon">⚠️</span>
        <h3 class="modal-title" id="modal-title">Confirm</h3>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="modalCancel()">Cancel</button>
        <button class="btn-confirm" id="modal-confirm">Remove</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
